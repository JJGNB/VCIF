# Modified SRResNet w/o BN from:
# Photo-Realistic Single Image Super-Resolution Using a Generative Adversarial Network

# ----------- Commands for running
# ----------- Single GPU with auto_resume
# PYTHONPATH="./:${PYTHONPATH}"  CUDA_VISIBLE_DEVICES=0 python basicsr/train.py -opt options/train/SRResNet_SRGAN/train_MSRResNet_x4.yml --auto_resume

# general settings
name: 001_VCIF_stage1forir_16k_B6G1_depth1_4scale_MCSE
model_type: BackboneModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
gpu_id: "0"
manual_seed: 2024

# dataset and data loader settings
datasets:
  train:
    name: LOL
    type: PairedImageDataset
    dataroot_gt: datasets/train/LLIE/gt_patches
    dataroot_lq: datasets/train/LLIE/lq_patches
    meta_info_file: ~
    filename_tmpl: '{}'
    io_backend:
      type: disk
      # (for lmdb)
      # type: lmdb
    gt_size: 256
    use_hflip: true
    use_rot: true
    yonly: false

    # data loader
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: LOL
    type: PairedImageDataset
    dataroot_gt: datasets/eval/LLIE/gt
    dataroot_lq: datasets/eval/LLIE/lq
    yonly: false
    io_backend:
      type: disk

# network structures
network_g:
  type: backbone
  source: vi #vi for net L, ir for net R


# path
path:
  pretrain_network_g: checkpoints/backbone/backbone_for_vi.pkl
  param_key_g: weight
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [250000, 250000, 250000, 250000]
    restart_weights: [1, 1, 1, 1]
    eta_min: !!float 1e-7

  total_iter: 16200
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 2.0
    reduction: mean
  perceptual_opt:
    type: SSIMLoss
    loss_weight: 1.0
    reduction: mean
  tv_opt:
    type: WeightedTVLoss
    loss_weight: 0.1
    reduction: mean
# validation settings
val:
  val_freq: !!float 5e3
  save_img: true

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
      better: higher  # the higher, the better. Default: higher
    # niqe:
    #   type: calculate_niqe
    #   crop_border: 4
    #   better: lower  # the lower, the better

# logging settings
logger:
  print_freq: 10
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
dist: ~
# dist training settings
dist_params:
  backend: nccl
  port: 29500
